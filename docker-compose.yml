# Local development infrastructure for PEOS (Phase 0).
# Ports are bound to 127.0.0.1 only, on non-default ports (55432, 56379) to avoid
# clashing with other local stacks. Credentials here are local-development values,
# never production values. See docs/decisions/0005-database-and-infrastructure.md.
name: peos

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-peos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-peos_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-peos}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the isolated `peos_test` database used by integration/E2E tests.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # AOF persistence so queued jobs survive container restarts.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-56379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
